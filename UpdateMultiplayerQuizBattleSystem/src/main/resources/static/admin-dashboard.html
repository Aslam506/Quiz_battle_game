<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Command Center | Quiz Battle</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --neon-cyan:#00f2fe;
    --bg-dark:#06090f;
    --card-bg:#111827;
}

body{
    background:var(--bg-dark);
    color:white;
    font-family:'Inter',sans-serif;
    padding:30px;
}

.main-title{
    font-family:'Syncopate',sans-serif;
    text-align:center;
    margin-bottom:30px;
    color:var(--neon-cyan);
}

.dashboard-card{
    background:var(--card-bg);
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.logout-btn{
    cursor:pointer;
    color:#ff4b2b;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- ================= SECURITY CHECK ================= -->
<script>
if(localStorage.adminAuth !== "true"){
    window.location.replace("admin-login.html");
}
</script>

<div class="container">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="main-title">QUIZ COMMAND CENTER</h1>
    <span onclick="logout()" class="logout-btn">
        <i class="fa-solid fa-power-off"></i> LOGOUT
    </span>
</div>

<div class="row g-4">

<div class="col-lg-7">
<div class="dashboard-card">
<h5>Live Leaderboard</h5>
<canvas id="leaderboardChart" height="200"></canvas>
</div>
</div>

<div class="col-lg-5">
<div class="dashboard-card">
<h5>Create Quiz</h5>
<input id="qt" class="form-control mb-2" placeholder="Quiz Title">
<input id="tl" type="number" class="form-control mb-2" placeholder="Time Limit">
<button onclick="createQuiz()" class="btn btn-info w-100">Create</button>
</div>
</div>

<div class="col-lg-6">
<div class="dashboard-card">
<h5>Add Question</h5>
<input id="q" class="form-control mb-2" placeholder="Question">
<input id="a" class="form-control mb-2" placeholder="Option A">
<input id="b" class="form-control mb-2" placeholder="Option B">
<input id="c" class="form-control mb-2" placeholder="Option C">
<input id="d" class="form-control mb-2" placeholder="Option D">
<select id="ca" class="form-control mb-2">
<option value="">Correct Option</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
</select>
<input id="points" type="number" class="form-control mb-2" placeholder="Points">
<button onclick="addQuestion()" class="btn btn-success w-100">Save Question</button>
</div>
</div>

<div class="col-lg-6">
<div class="dashboard-card">
<h5>All Questions</h5>
<table class="table table-dark">
<thead>
<tr><th>#</th><th>Preview</th><th>Ans</th><th>Pts</th><th>Action</th></tr>
</thead>
<tbody id="questionList"></tbody>
</table>
</div>
</div>

</div>
</div>

<script>

/* ================= BACK BUTTON BLOCK ================= */
history.pushState(null,null,location.href);
window.addEventListener("popstate",()=>logout());

/* ================= CHART ================= */
let lbChart;

function updateChart(){
fetch('/admin/leaderboard')
.then(r=>r.json())
.then(data=>{
const labels=data.map(u=>u.username);
const scores=data.map(u=>u.score);

if(lbChart){
    lbChart.data.labels=labels;
    lbChart.data.datasets[0].data=scores;
    lbChart.update();
}else{
    const ctx=document.getElementById('leaderboardChart').getContext('2d');
    lbChart=new Chart(ctx,{
        type:'bar',
        data:{
            labels:labels,
            datasets:[{
                data:scores,
                backgroundColor:'#00f2fe'
            }]
        },
        options:{plugins:{legend:{display:false}}}
    });
}
});
}

/* ================= QUESTIONS ================= */
function fetchQuestions(){
fetch('/admin/questions')
.then(r=>r.json())
.then(data=>{
const tbody=document.getElementById('questionList');
tbody.innerHTML=data.map((q,i)=>`
<tr>
<td>${i+1}</td>
<td>${q.question.substring(0,20)}...</td>
<td>${q.correctOption}</td>
<td>${q.points}</td>
<td><button onclick="deleteQuestion(${q.id})" class="btn btn-sm btn-danger">X</button></td>
</tr>`).join('');
});
}

async function addQuestion(){
await fetch('/admin/question',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
quizId:1,
question:q.value,
optionA:a.value,
optionB:b.value,
optionC:c.value,
optionD:d.value,
correctOption:ca.value,
points:points.value
})
});
fetchQuestions();
}

async function createQuiz(){
await fetch('/admin/quiz',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
title:qt.value,
timeLimit:tl.value
})
});
alert("Quiz Created");
}

async function deleteQuestion(id){
await fetch('/admin/question/'+id,{method:'DELETE'});
fetchQuestions();
}

/* ================= LOGOUT ================= */
function logout(){
localStorage.removeItem("adminAuth");
localStorage.clear();
sessionStorage.clear();
window.location.replace("admin-login.html");
}

/* ================= AUTO LOGOUT TAB CLOSE ================= */
window.addEventListener("beforeunload",()=>{
localStorage.removeItem("adminAuth");
});

/* ================= INIT ================= */
updateChart();
fetchQuestions();
setInterval(updateChart,5000);

</script>
</body>
</html>
