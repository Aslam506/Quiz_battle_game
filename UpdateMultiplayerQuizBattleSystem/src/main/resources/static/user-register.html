<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Registration | Quiz Battle</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --primary:#00d2ff;
    --secondary:#3a7bd5;
    --glass:rgba(255,255,255,0.08);
}

html,body{
    height:100%;
    margin:0;
    font-family:'Inter',sans-serif;
    background:#06090f;
    color:white;
    overflow:hidden;
}

.bg-animate{
    position:fixed;
    inset:0;
    z-index:-1;
    background:radial-gradient(circle at 30% 30%,#1a2a6c,#06090f,#16213e);
    background-size:400% 400%;
    animation:gradientMove 15s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container-flex{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.registration-card{
    background:var(--glass);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:22px;
    padding:42px 36px;
    width:100%;
    max-width:420px;
    box-shadow:0 25px 45px rgba(0,0,0,0.45);
}

h2{
    font-family:'Syncopate',sans-serif;
    text-align:center;
    margin-bottom:30px;
    background:linear-gradient(to right,#fff,var(--primary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.input-group{
    background:rgba(255,255,255,0.06);
    border-radius:14px;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,0.15);
}

.form-control{
    background:transparent;
    border:none;
    color:white;
}

.form-control:focus{
    background:transparent;
    box-shadow:none;
    color:white;
}

.btn-register{
    background:linear-gradient(45deg,var(--primary),var(--secondary));
    border:none;
    border-radius:14px;
    padding:14px;
    font-weight:700;
    width:100%;
}

.footer-text{
    text-align:center;
    margin-top:20px;
    font-size:0.85rem;
}

.footer-text a{
    color:var(--primary);
    text-decoration:none;
}
</style>
</head>

<body>

<script>
/* ================= REDIRECT IF ALREADY LOGGED ================= */
if(localStorage.username){
    window.location.replace("player-dashboard.html");
}

/* ================= BLOCK BACK BUTTON ================= */
history.pushState(null,null,location.href);
window.addEventListener("popstate",function(){
    history.pushState(null,null,location.href);
});
</script>

<div class="bg-animate"></div>

<div class="container-flex">
<div class="registration-card">

<h2>Player Registration</h2>

<div class="input-group">
<span class="input-group-text bg-transparent border-0 text-info">
<i class="fa-solid fa-user"></i>
</span>
<input type="text" id="u" class="form-control" placeholder="Choose Username">
</div>

<div class="input-group">
<span class="input-group-text bg-transparent border-0 text-info">
<i class="fa-solid fa-lock"></i>
</span>
<input type="password" id="p" class="form-control" placeholder="Set Password">
<span class="input-group-text bg-transparent border-0 text-info" style="cursor:pointer" onclick="togglePassword()">
<i class="fa-solid fa-eye"></i>
</span>
</div>

<button class="btn btn-register text-white" onclick="register()">
Register
</button>

<div class="footer-text">
Already have an account?
<a href="user-login.html">Login here</a>
</div>

</div>
</div>

<script>

/* ================= PASSWORD TOGGLE ================= */
function togglePassword(){
const pass=document.getElementById("p");
pass.type=pass.type==="password"?"text":"password";
}

/* ================= REGISTER FUNCTION ================= */
async function register(){

const username=document.getElementById("u").value.trim();
const password=document.getElementById("p").value.trim();

if(!username || !password){
alert("Please fill in all fields");
return;
}

try{

const res=await fetch('/auth/register',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
username,
password,
role:'PLAYER'
})
});

if(res.ok){
alert("🎉 Registration Successful!");
window.location.replace("user-login.html");
}else{
alert("Username already exists.");
}

}catch(e){
alert("Server not reachable. Please start Spring Boot.");
}

}

/* ================= AUTO CLEAR ON TAB CLOSE (OPTIONAL) ================= */
window.addEventListener("beforeunload",function(){
/* optional logout logic */
});

</script>

</body>
</html>
