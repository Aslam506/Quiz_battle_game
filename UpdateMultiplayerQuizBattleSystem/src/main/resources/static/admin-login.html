<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Access | Quiz Battle System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --admin-red:#ff4b2b;
    --admin-gold:#ffcc33;
    --dark-panel:rgba(10,10,15,0.85);
}

body,html{
    height:100%;
    margin:0;
    font-family:'Orbitron',sans-serif;
    color:white;
    overflow:hidden;
}

.admin-bg{
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)),
        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80&w=1920');
    background-size:cover;
    background-position:center;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-shield{
    background:var(--dark-panel);
    backdrop-filter:blur(15px);
    border:2px solid var(--admin-red);
    border-radius:20px;
    padding:50px 40px;
    width:100%;
    max-width:420px;
    box-shadow:0 0 30px rgba(255,75,43,0.3);
    text-align:center;
}

.shield-icon{
    font-size:3rem;
    color:var(--admin-red);
    margin-bottom:20px;
}

h2{
    font-family:'Syncopate',sans-serif;
    letter-spacing:3px;
    margin-bottom:30px;
}

.input-box{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:8px;
    margin-bottom:20px;
}

.form-control{
    background:transparent;
    border:none;
    color:white;
}

.form-control:focus{
    background:transparent;
    box-shadow:none;
    color:white;
}

.btn-admin{
    background:var(--admin-red);
    border:none;
    color:white;
    padding:14px;
    width:100%;
    font-weight:700;
    border-radius:8px;
    letter-spacing:2px;
}

.btn-admin:hover{
    background:#ff3b1b;
}

.warning-text{
    font-size:0.7rem;
    color:var(--admin-gold);
    margin-top:20px;
}
</style>
</head>

<body>

<script>
/* ================= REDIRECT IF ALREADY LOGGED ================= */
if(localStorage.adminAuth === "true"){
    window.location.replace("admin-dashboard.html");
}

/* ================= BLOCK BACK BUTTON ================= */
history.pushState(null,null,location.href);
window.addEventListener("popstate",function(){
    history.pushState(null,null,location.href);
});
</script>

<div class="admin-bg">
<div class="login-shield">

<div class="shield-icon">
<i class="fa-solid fa-user-shield"></i>
</div>

<h2>ADMIN PORTAL</h2>

<div class="input-box d-flex align-items-center px-3">
<i class="fa-solid fa-terminal text-muted me-2"></i>
<input type="text" id="u" class="form-control" placeholder="Root Username">
</div>

<div class="input-box d-flex align-items-center px-3">
<i class="fa-solid fa-key text-muted me-2"></i>
<input type="password" id="p" class="form-control" placeholder="Security Key">
</div>

<button onclick="login()" class="btn-admin">
Verify Credentials
</button>

<p class="warning-text">
<i class="fa-solid fa-circle-exclamation me-1"></i>
Authorized Personnel Only
</p>

</div>
</div>

<script>

/* ================= LOGIN FUNCTION ================= */
async function login(){

const username=document.getElementById("u").value;
const password=document.getElementById("p").value;

if(!username || !password){
    alert("Credentials Required");
    return;
}

try{

const response=await fetch('/auth/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({username,password})
});

if(!response.ok){
    alert("Invalid Credentials");
    return;
}

const data=await response.json();

if(data.role==="ADMIN"){

/* Store secure flag */
localStorage.setItem("adminAuth","true");

/* Redirect without history */
window.location.replace("admin-dashboard.html");

}else{
alert("⛔ ACCESS DENIED: Not Admin");
}

}catch(error){
alert("Server Error");
}

}

/* ================= AUTO CLEAR ON TAB CLOSE ================= */
window.addEventListener("beforeunload",function(){
/* Optional auto logout */
});

</script>

</body>
</html>
